name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant gradle permission
        run: chmod +x gradlew

      - name: Build backend
        run: ./gradlew build

      - name: Run backend tests
        run: ./gradlew test

  frontend:
    runs-on: ubuntu-latest
    needs: backend

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Build frontend
        run: npm run build

  healthcheck:
    runs-on: ubuntu-latest
    needs: frontend

    steps:
      - name: Wait for Railway deploy
        run: sleep 60

      - name: Check backend health
        run: |
          curl --fail https://cafe-management-backend.up.railway.app/actuator/health

